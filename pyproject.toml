[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beyondbench"
version = "0.2.0"
description = "BeyondBench: Contamination-Resistant Evaluation of Reasoning in Language Models"
readme = "README_PYPI.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Gaurav Srivastava", email = "gks@vt.edu"},
    {name = "Aafiya Hussain"},
    {name = "Zhenyu Bi"},
    {name = "Swastik Roy"},
    {name = "Priya Pitre"},
    {name = "Meng Lu"},
    {name = "Morteza Ziyadi"},
    {name = "Xuan Wang"},
]
maintainers = [
    {name = "Gaurav Srivastava", email = "gks@vt.edu"},
]
keywords = [
    "language-models",
    "evaluation",
    "benchmark",
    "reasoning",
    "nlp",
    "ai",
    "machine-learning",
    "llm-evaluation",
    "computational-reasoning",
    "contamination-resistant",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5.0",
    "transformers>=4.47.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "tqdm>=4.67.0",
    "tiktoken>=0.12.0",
    "sentencepiece>=0.2.0",
    "click>=8.1.0",
    "rich>=14.0.0",
    "colorama>=0.4.6",
    "scipy>=1.14.0",
    "pyyaml>=6.0.0",
    "jsonschema>=4.23.0",
    "psutil>=6.0.0",
    "tabulate>=0.9.0",
    "accelerate>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
openai = ["openai>=2.0.0"]
gemini = ["google-genai>=1.0.0"]
anthropic = ["anthropic>=0.40.0"]
vllm = ["vllm>=0.7.0"]
all-apis = [
    "openai>=2.0.0",
    "google-genai>=1.0.0",
    "anthropic>=0.40.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.8.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "myst-parser>=3.0.0",
]
viz = [
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "tabulate>=0.9.0",
    "plotly>=5.20.0",
    "kaleido>=0.2.1",
]
serve = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]
dashboard = [
    "gradio>=4.0.0",
]
full = [
    "beyondbench[all-apis,dev,docs,viz,serve,dashboard]",
    "vllm>=0.7.0",
]

[project.scripts]
beyondbench = "beyondbench.cli.main:cli"

[project.urls]
Homepage = "https://github.com/ctrl-gaurav/BeyondBench"
Documentation = "https://github.com/ctrl-gaurav/BeyondBench#readme"
Repository = "https://github.com/ctrl-gaurav/BeyondBench"
"Bug Tracker" = "https://github.com/ctrl-gaurav/BeyondBench/issues"
Changelog = "https://github.com/ctrl-gaurav/BeyondBench/blob/main/CHANGELOG.md"
Paper = "https://arxiv.org/abs/2509.24210"

[tool.setuptools]
packages = ["beyondbench", "beyondbench.cli", "beyondbench.core", "beyondbench.models", "beyondbench.tasks", "beyondbench.tasks.easy", "beyondbench.tasks.medium", "beyondbench.tasks.hard", "beyondbench.utils", "beyondbench.parsers", "beyondbench.scripts", "beyondbench.serve", "beyondbench.dashboard", "beyondbench.utils.model_profiles"]

[tool.setuptools.package-data]
beyondbench = ["configs/*.yaml", "configs/*.json", "py.typed"]
"beyondbench.utils.model_profiles" = ["*.json"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["beyondbench"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
markers = [
    "gpu: marks tests that require a real CUDA GPU",
    "slow: marks tests that are slow (real model inference)",
    "api: marks tests that require API keys",
    "unit: marks fast unit tests (no GPU required)",
    "integration: marks integration tests (real GPU required)",
    "e2e: marks end-to-end tests (real GPU + full pipeline)",
]

[tool.coverage.run]
source = ["beyondbench"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "beyondbench/serve/*",
    "beyondbench/dashboard/*",
    "beyondbench/utils/visualizer.py",
    "beyondbench/scripts/*",
]

[tool.coverage.report]
fail_under = 45
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "main_website",
    ".build_plan",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E741",  # ambiguous variable name
    "F401",  # unused import (some are re-exports)
    "UP007", # use X | Y for unions (keep Optional for 3.8 compat)
]

[tool.ruff.lint.isort]
known-first-party = ["beyondbench"]

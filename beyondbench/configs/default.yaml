# BeyondBench Default Evaluation Configuration
model:
  model_id: "meta-llama/Llama-3.2-3B-Instruct"
  backend: "vllm"

evaluation:
  suite: "easy"
  datapoints: 100
  folds: 1
  list_sizes: [8, 16, 32]
  temperature: 0.7
  top_p: 0.9
  max_tokens: 32768

output:
  output_dir: "./beyondbench_results"
  store_details: false
  log_level: "INFO"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E676;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00BFA5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#69F0AE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00E676;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A5D6A7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E676;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#00BFA5;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020a06;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#041208;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="400" height="400" rx="40" fill="url(#bgGradient)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#00E676" stroke-width="0.5">
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
  </g>

  <!-- Background glow circle -->
  <circle cx="200" cy="200" r="160" fill="url(#glowGradient)" />

  <!-- Outer hexagon -->
  <polygon
    points="200,35 335,110 335,250 200,325 65,250 65,110"
    fill="none"
    stroke="url(#primaryGradient)"
    stroke-width="3"
    filter="url(#glow)"
    opacity="0.9"
  />

  <!-- Inner hexagon -->
  <polygon
    points="200,65 305,125 305,235 200,295 95,235 95,125"
    fill="none"
    stroke="url(#accentGradient)"
    stroke-width="1.5"
    opacity="0.5"
  />

  <!-- Stylized B letter with neon glow -->
  <g transform="translate(128, 110)" filter="url(#neonGlow)">
    <path
      d="M0,0 L0,150 M0,0 L55,0 Q90,0 90,37 Q90,75 55,75 L0,75 M0,75 L65,75 Q110,75 110,112 Q110,150 65,150 L0,150"
      fill="none"
      stroke="url(#primaryGradient)"
      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Circuit trace nodes -->
  <g opacity="0.8">
    <circle cx="140" cy="140" r="4" fill="#00E676" filter="url(#softGlow)"/>
    <circle cx="260" cy="140" r="4" fill="#00E676" filter="url(#softGlow)"/>
    <circle cx="140" cy="260" r="4" fill="#69F0AE" filter="url(#softGlow)"/>
    <circle cx="260" cy="260" r="4" fill="#69F0AE" filter="url(#softGlow)"/>
    <circle cx="200" cy="100" r="3" fill="#00BFA5" filter="url(#softGlow)"/>
    <circle cx="200" cy="300" r="3" fill="#00BFA5" filter="url(#softGlow)"/>

    <!-- Connection lines -->
    <line x1="140" y1="140" x2="200" y2="100" stroke="#00E676" stroke-width="1" opacity="0.4"/>
    <line x1="260" y1="140" x2="200" y2="100" stroke="#00E676" stroke-width="1" opacity="0.4"/>
    <line x1="140" y1="260" x2="200" y2="300" stroke="#69F0AE" stroke-width="1" opacity="0.4"/>
    <line x1="260" y1="260" x2="200" y2="300" stroke="#69F0AE" stroke-width="1" opacity="0.4"/>
    <line x1="140" y1="140" x2="140" y2="260" stroke="#00BFA5" stroke-width="1" opacity="0.3"/>
    <line x1="260" y1="140" x2="260" y2="260" stroke="#00BFA5" stroke-width="1" opacity="0.3"/>
    <line x1="140" y1="140" x2="260" y2="260" stroke="#00E676" stroke-width="0.8" opacity="0.2"/>
    <line x1="260" y1="140" x2="140" y2="260" stroke="#00E676" stroke-width="0.8" opacity="0.2"/>
  </g>

  <!-- Performance bars at bottom -->
  <g transform="translate(115, 315)">
    <rect x="0" y="0" width="26" height="35" rx="3" fill="url(#primaryGradient)" opacity="0.7">
      <animate attributeName="height" values="35;40;35" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="0;-5;0" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="36" y="-10" width="26" height="45" rx="3" fill="url(#primaryGradient)" opacity="0.8">
      <animate attributeName="height" values="45;50;45" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-10;-15;-10" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="72" y="-25" width="26" height="60" rx="3" fill="url(#primaryGradient)" opacity="0.95">
      <animate attributeName="height" values="60;65;60" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-25;-30;-25" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="108" y="-15" width="26" height="50" rx="3" fill="url(#accentGradient)" opacity="0.85">
      <animate attributeName="height" values="50;55;50" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-15;-20;-15" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="144" y="5" width="26" height="30" rx="3" fill="url(#accentGradient)" opacity="0.6">
      <animate attributeName="height" values="30;35;30" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="5;0;5" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Corner accent dots -->
  <circle cx="50" cy="50" r="2" fill="#00E676" opacity="0.6"/>
  <circle cx="350" cy="50" r="2" fill="#00E676" opacity="0.6"/>
  <circle cx="50" cy="350" r="2" fill="#69F0AE" opacity="0.6"/>
  <circle cx="350" cy="350" r="2" fill="#69F0AE" opacity="0.6"/>
</svg>

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Import validation
        run: python -c "import beyondbench; print(f'beyondbench {beyondbench.__version__} imported successfully')"
      - name: Run unit tests with coverage
        run: |
          pytest tests/ -v --tb=short -x \
            -m "not gpu and not slow and not api and not integration and not e2e" \
            --cov=beyondbench --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=50 \
            --timeout=120
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
